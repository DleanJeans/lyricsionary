appId: com.dleanjeans.lyricsionary
---
# Test: Translation lines should reset to blurred state when switching songs — #148

- runFlow: ../00-launch-app.yaml

# Create first song with translation
- tapOn: Song Name
- inputText: "First Song"
- pressKey: Back

- tapOn: Original Lyrics
- inputText: "Hello world\nThis is a test"
- pressKey: Back

- tapOn: Add Translation
- tapOn: Add
- inputText: "Bonjour monde\nCeci est un test"
- pressKey: Back

- tapOn: Save

# Go to Learn screen and verify blur functionality works
- tapOn: Learn
- assertVisible: "Hello world"
- assertVisible: "Bonjour monde"

# Open settings to ensure blur is enabled
- tapOn:
    point: "95%,5%"  # Settings icon in top-right
- tapOn: Blur Translations
- tapOn:
    point: "5%,5%"  # Close settings (tap outside)

# Tap a translation to unblur it
- tapOn: "Bonjour monde"

# Verify the translation is now unblurred (still visible and clickable)
- assertVisible: "Bonjour monde"

# Go back to Songs screen
- tapOn: Songs

# Create second song
- tapOn: "New Lyrics"
- tapOn: Song Name
- inputText: "Second Song"
- pressKey: Back

- tapOn: Original Lyrics
- inputText: "Goodbye moon\nAnother test line"
- pressKey: Back

- tapOn: Add Translation
- tapOn: Add
- inputText: "Au revoir lune\nUne autre ligne de test"
- pressKey: Back

- tapOn: Save

# Navigate to Learn screen for second song
- tapOn: Learn
- assertVisible: "Goodbye moon"

# The bug: translations should be blurred again (reset from first song's unblurred state)
# We test this by opening settings and checking the blur toggle is still on
- tapOn:
    point: "95%,5%"  # Settings icon
- assertVisible: Blur Translations
- tapOn:
    point: "5%,5%"  # Close settings

# Navigate back to first song to verify it also resets
- tapOn: Songs
- tapOn: "First Song"
- tapOn: Learn

# Verify first song's translations are also blurred again (reset)
- assertVisible: "Hello world"
- assertVisible: "Bonjour monde"
