name: EAS

on:
  push:
    branches: [main]
  pull_request:
    types: labeled
  workflow_dispatch:

jobs:
  eas:
    uses: DleanJeans/expo-workflows/.github/workflows/eas.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      app-name: lyricsionary
      expo-project-slug: lyricsionary
      ota-push-branch: production
      ota-label: expo ota
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
