name: EAS

on:
  push:
    branches: [main]
  pull_request:
    types: labeled
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  eas:
    uses: DleanJeans/expo-workflows/.github/workflows/eas.yml@main
    with:
      app-name: lyricsionary
      expo-project-slug: lyricsionary
      ota-label: expo ota
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
