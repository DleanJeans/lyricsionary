name: Local APK

# Builds the APKs on GitHub runners with `eas build --local`, skipping the EAS build queue.
# Run it from the Actions tab, or add the `local apk` label to a PR.
on:
  pull_request:
    types: labeled
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.profile }} APK
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'local apk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [preview, development]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup environment
        uses: DleanJeans/expo-workflows/.github/actions/pnpm-expo@main
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.profile }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ matrix.profile }}-

      - name: Build APK
        run: eas build --local --platform android --profile ${{ matrix.profile }} --non-interactive --output lyricsionary-${{ matrix.profile }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lyricsionary-${{ matrix.profile }}-apk
          path: lyricsionary-${{ matrix.profile }}.apk
