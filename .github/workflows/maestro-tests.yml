name: Maestro Tests

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  maestro-test:
    name: Run Maestro Tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.label.name, 'run maestro tests'))
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      MAESTRO_CLI_NO_ANALYTICS: true
    steps:
      - uses: actions/checkout@v4

      - name: Start Emulator (if not running)
        run: |
          if $ANDROID_HOME/platform-tools/adb devices | grep -q "emulator"; then
            echo "Emulator already running"
          else
            pnpm emulator &
            echo "Waiting for emulator to boot..."
            $ANDROID_HOME/platform-tools/adb wait-for-device
            for i in $(seq 1 60); do
              if [ "$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null)" = "1" ]; then
                echo "Emulator booted"
                break
              fi
              sleep 2
            done
          fi

      - name: Start Metro bundler (if not running)
        run: |
          if curl -s http://localhost:8081/status | grep -q "running"; then
            echo "Metro already running"
          else
            npx expo start --port 8081 &
            echo "Waiting for Metro..."
            for i in $(seq 1 60); do
              if curl -s http://localhost:8081/status | grep -q "running"; then
                echo "Metro ready"
                break
              fi
              sleep 2
            done
          fi

      - name: Run Maestro Tests
        id: maestro
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro test .maestro --format junit --output test-results.xml
        continue-on-error: true

      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let lines = [];

            try {
              const xml = fs.readFileSync('test-results.xml', 'utf8');
              const cases = xml.match(/<testcase[^]*?<\/testcase>/g) || [];
              for (const tc of cases) {
                const name = (tc.match(/name="([^"]+)"/) || [,''])[1];
                const time = (tc.match(/time="([^"]+)"/) || [,''])[1];
                const seconds = time ? Math.round(parseFloat(time)) + 's' : '';
                const failed = tc.includes('<failure') || tc.includes('<error');
                lines.push({
                  status: failed ? '❌' : '✅',
                  text: `${name} (${seconds})`
                });
              }
            } catch (e) {
              lines.push({ status: '⚠️', text: 'Could not parse test-results.xml' });
            }

            const passed = lines.filter(l => l.status === '✅').length;
            const failed = lines.filter(l => l.status === '❌').length;
            const status = failed > 0 ? '❌' : '✅';
            let body = `### 🎭 Maestro Tests: ${status} ${passed} passed, ${failed} failed\n\n`;
            for (const l of lines) {
              body += `${l.status} ${l.text}\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });