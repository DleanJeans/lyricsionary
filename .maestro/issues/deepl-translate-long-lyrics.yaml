appId: com.dleanjeans.lyricsionary
---
# Test: DeepL translation handles lyrics >1500 characters with chunking
# This test verifies that long lyrics are split into chunks and translated properly

- runFlow: ../00-launch-app.yaml

# Create a song with long lyrics (>1500 chars after deduplication)
- tapOn: "New Lyrics"

- tapOn: "Song Name"
- inputText: "Long Lyrics Test"
- pressKey: "Back"

- tapOn: "Artist Name"
- inputText: "Test Artist"
- pressKey: "Back"

# Input lyrics with many unique lines to exceed 1500 chars
# Each line is ~70 chars, so 25 lines = ~1750 chars
- tapOn:
    text: "Original Lyrics"
    index: 0
- inputText: |
    This is verse line 1 that is pretty long to test chunking properly ok
    This is verse line 2 that is pretty long to test chunking properly ok
    This is verse line 3 that is pretty long to test chunking properly ok
    This is verse line 4 that is pretty long to test chunking properly ok
