name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'DleanJeans' && (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reply with action URL
        id: action-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTION_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ github.job }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            COMMENT_ID=$(gh issue comment "${{ github.event.issue.number }}" --body "🚀 [OpenCode running...]($ACTION_URL)" --json id --jq '.id')
          else
            COMMENT_ID=$(gh pr comment "${{ github.event.pull_request.number }}" --body "🚀 [OpenCode running...]($ACTION_URL)" --json id --jq '.id')
          fi
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.1
          prompt: |
            When creating a branch/PR for an issue, name it in this format: `opencode/issue{issue_number}-{summarized_from_issue_title_and_changes}`
            Work on each bullet/numbered point and push as a separate commit.
            Don't forget to push the commits.

      - name: Delete action URL comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_ID="${{ steps.action-comment.outputs.comment_id }}"
          if [ -n "$COMMENT_ID" ]; then
            gh api "/repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X DELETE
          fi