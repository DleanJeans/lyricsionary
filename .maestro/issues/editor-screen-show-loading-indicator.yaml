appId: com.dleanjeans.lyricsionary
---
# Test: EditorScreen shows loading indicator on Save button after press
# Verifies that the Save button remains interactable and completes the save operation

- runFlow: ../00-launch-app.yaml

- tapOn: "Song Name"
- inputText: "Loading Indicator Test"
- pressKey: "Back"

- tapOn: "Artist Name"
- inputText: "Test Artist"
- pressKey: "Back"

# Add some lyrics
- tapOn:
    id: "lyrics-input"
- inputText: "Test lyrics line 1\nTest lyrics line 2"
- pressKey: "Back"

# Tap Save button - loading indicator should appear briefly during save
- tapOn: "Save"

# Verify that save completed successfully by checking that we can navigate to Learn screen
- tapOn: "Learn"
- assertVisible: "Test lyrics line 1"
- assertVisible: "Test lyrics line 2"

# Go back to Editor to verify the song was saved
- tapOn: "Editor"
- assertVisible: "Loading Indicator Test"
- assertVisible: "Test Artist"
